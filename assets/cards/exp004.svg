<svg xmlns="http://www.w3.org/2000/svg" width="470" height="523" viewBox="0 0 470 523" role="img" aria-label="EXP 004 card"><title>EXP 004: Creating digital employees with the help of open source LLMs.</title><defs><clipPath id="clip004"><rect x="24" y="24" width="422" height="263.75" rx="10"/></clipPath></defs><rect x="0.75" y="0.75" width="468.5" height="521.5" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/><image x="24" y="24" width="422" height="263.75" href="data:image/webp;base64," preserveAspectRatio="xMidYMid slice" clip-path="url(#clip004)"/><rect x="24.5" y="24.5" width="421" height="262.75" rx="9.5" fill="none" stroke="#E5E7EB"/><text x="24" y="328" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="12" font-weight="bold" fill="#9CA3AF" letter-spacing="2">EXP 004</text><rect x="373" y="313" width="73" height="22" rx="11" fill="#0C0C0C"/><circle cx="387" cy="324" r="4" fill="#4ADE80"/><text x="397" y="328" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" font-weight="bold" fill="#4ADE80">Stable</text><text x="24" y="374" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="16" font-weight="bold" fill="#0C0C0C">Creating digital employees with the help of</text><text x="24" y="395" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="16" font-weight="bold" fill="#0C0C0C">open source LLMs.</text><text x="24" y="428" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="13" fill="#4B5563">3 workflows, 266 nodes, customer service, sales admin,</text><text x="24" y="445" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="13" fill="#4B5563">lead routing, running 24/7 on modest hardware.</text><text x="24" y="462" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="13" fill="#4B5563">Equivalent to 9 to 10 administrative roles.</text><text x="24" y="499" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" font-weight="bold" fill="#D70000" letter-spacing="1.6">READ EXP 004 -&gt;</text></svg>